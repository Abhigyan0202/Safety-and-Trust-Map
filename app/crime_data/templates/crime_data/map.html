
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safety and Trust Map | Mumbai</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            padding: 18px 24px;
            background: #172554;
            color: white;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        header p {
            margin: 0;
            color: #dbeafe;
            font-size: 14px;
        }

        #map {
            height: calc(100vh - 90px);
            min-height: 400px;
            width: 100%;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .popup-info {
            margin: 0 0 8px;
        }

        .popup-hint {
            color: #2563eb;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Safety and Trust Map</h1>
        <p>Explore crime statistics across Mumbai</p>
    </header>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    {{ regions|json_script:"regions-data" }}

    <script>
        L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';

        const map = L.map("map").setView(
            [19.0760, 72.8777],
            11
        );

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    'OpenStreetMap</a> contributors'
            }
        ).addTo(map);
        const geojsonUrl =
    '/static/crime_data/mumbai_police_station_jurisdictions_matched.geojson';

fetch(geojsonUrl)
    .then(response => {
        console.log("HTTP status:", response.status);

        if (!response.ok) {
            throw new Error(
                `Failed to load GeoJSON: ${response.status}`
            );
        }

        return response.json();
    })
    .then(data => {
        console.log("GeoJSON loaded:", data);
        console.log("Number of features:", data.features.length);

        const stations = L.geoJSON(data, {
            style: {
                color: '#333333',
                weight: 2,
                fillColor: '#3498db',
                fillOpacity: 0.3
            },
            onEachFeature: (feature, layer) => {
                layer.bindTooltip(feature.properties.name);
            }
        }).addTo(map);

        console.log("Layer bounds:", stations.getBounds());

        map.fitBounds(stations.getBounds());
    })
    .catch(error => {
        console.error("GeoJSON loading error:", error);
    });
    </script>
</body>
</html>
