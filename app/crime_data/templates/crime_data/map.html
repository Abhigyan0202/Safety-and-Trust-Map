
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safety and Trust Map | Mumbai</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            padding: 18px 24px;
            background: #172554;
            color: white;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        header p {
            margin: 0;
            color: #dbeafe;
            font-size: 14px;
        }

        #map {
            height: calc(100vh - 90px);
            min-height: 400px;
            width: 100%;
        }

        
    </style>
</head>

<body>
    <header>
        <h1>Safety and Trust Map</h1>
        <p>Explore crime statistics across Mumbai</p>
    </header>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    {{ regions|json_script:"regions-data" }}

    <script>
        L.TileLayer.prototype.options.referrerPolicy = 'strict-origin-when-cross-origin';

        const map = L.map("map").setView(
            [19.0760, 72.8777],
            11
        );

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                    'OpenStreetMap</a> contributors'
            }
        ).addTo(map);
        const geojsonUrl =
    '/static/crime_data/mumbai_police_station_jurisdictions_matched.geojson';
    const coloursURL = "/getColours"

    const getRegionColour = async (region_name) => {
        return "#ff3300";
    }

    Promise.all([
    fetch('/static/crime_data/mumbai_police_station_jurisdictions_matched.geojson')
        .then(response => response.json()),

    fetch('/getColours')
        .then(response => response.json())
])
.then(([geojsonData, colours]) => {
    console.log(colours)
    const stations = L.geoJSON(geojsonData, {
        style: function(feature) {
            const regionName = feature.properties.name;
            return {
                color: '#333333',
                weight: 1,
                fillColor: colours[regionName] || '#cccccc',
                fillOpacity: 0.65
            };
        },

        onEachFeature: function(feature, layer) {

            const regionName = feature.properties.name;

            layer.bindTooltip(regionName);

            layer.on('click', (feature, layer)=> {
                    console.log(regionName);
                    window.open(`/fetch_region?name=${encodeURIComponent(regionName)}`, '_blank', 'noopener,noreferrer');
                });
        }

    }).addTo(map);

    map.fitBounds(stations.getBounds());

})
.catch(error => {
    console.error("Error loading map:", error);
});
    </script>
</body>
</html>
