
{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safety and Trust Map | Mumbai</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="{% static 'crime_data/css/styles.css'  %}">
</head>

<body>
    <header>
        <div>
            <h1>Safety and Trust Map</h1>
            <p>Explore crime statistics across Mumbai</p>
        </div>
        
        <div class="search-container">
        <input
            type="text"
            id="search"
            placeholder="Search..."
            autocomplete="off"
        >

        <div id="dropdown" class="dropdown"></div>
    </div>
    </header>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

   
    
    <script src="{% static 'crime_data/js/map.js' %}"></script>
</body>
</html>
