{% extends "app/base.html" %}

{% block title %}Logout | Trust App{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-xl">

        <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-100">
            <svg class="h-8 w-8 text-red-600" fill="none"
                 stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H9m4 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900">
            Ready to leave?
        </h1>

        <p class="mt-3 text-sm leading-6 text-gray-600">
            Are you sure you want to log out of your Safety & Trust Map account?
        </p>

        <div class="mt-8 flex flex-col gap-3 sm:flex-row">
            <a href="{% url 'profile' %}"
               class="inline-flex flex-1 items-center justify-center rounded-lg border border-gray-300 px-5 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-50">
                Cancel
            </a>

            <form method="POST" action="{% url 'logout' %}" class="flex-1">
                {% csrf_token %}
                <button type="submit"
                        class="w-full rounded-lg bg-red-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    Yes, log me out
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
